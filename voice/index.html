<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Chat</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tinos:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">

    <link rel="icon" type="image/x-icon" href="../assets/favicon.ico">

    <style>
        body {
            background-color: rgba(241, 239, 231);
            margin: 0;
        }

        * {
            font-family: 'Tinos', 'Times New Roman', Times, serif;
            font-weight: 700;
            box-sizing: border-box;
        }

        .user-interface-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between; 

            min-height: 100dvh; 
            padding: 10dvh 0 0 0;
        }

        @media (min-height: 800px) and (min-width: 1024px) {
            .user-interface-container {
                padding: 20dvh 0 0 0;
            }
        }

        .controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px; 
        }

        .footer {
            display: flex;
            flex-direction: row;
        }

        #chatMessage {
            width: 500px;
            height: 50px;
            resize: none;
        }

        .logo-link {
            align-self: flex-start;
            display: block;
            line-height: 0;
            text-decoration: none;
            margin-left: 20px;
            margin-bottom: 20px;
        }

        .logo-png {
            display: block;
            align-self: flex-start;
            width: 20dvh;
            height: auto;
        }

        .disclaimer {
            font-size: 4vh;
            text-align: center;
            width: 70vw;
        }

        .disclaimer2 {
            font-size: 2vh;
            text-align: center;
            width: 35vw;
        }
    </style>
</head>
<body>
    
    <div class="user-interface-container">
        <div class="controls">
            <select id="voiceInput">
                <option value="brantley">brantley</option>
                <option value="jasper">jasper</option>
                <option value="ethan">ethan</option>
            </select>

            <textarea id="chatMessage" placeholder="enter prompt here" style="width: 70vw; height: 50px;"></textarea>
            <button id="sendButton" onclick="runVoiceAssistant()">Send Message</button>

            <div id="status" style="text-align: center;"></div>
        </div>

        <div class="disclaimer">note: it could take a few minutes for the voice assistant to respond.</div>
        <div class="disclaimer2">This voice assistant is powered by AI. AI can make mistakes. Do not rely on this for important information.</div>

        <a href="../" class="logo-link">
            <img src="../assets/logo.png" class="logo-png">
        </a>
    </div>

    <script>
        const apiUrl = 'https://api.voicemath.cc/ask'; // Updated URL
        let audioContext;
        const sampleRate = 24000;
        let nextChunkStartTimestamp = 0;

        async function runVoiceAssistant() {
            if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: sampleRate });
            if (audioContext.state === 'suspended') await audioContext.resume();

            const promptText = document.getElementById('chatMessage').value.trim();
            const voiceSelection = document.getElementById('voiceInput').value.trim();
            
            if (!promptText) return;

            document.getElementById('status').innerText = 'starting...';
            document.getElementById('sendButton').disabled = true; // Prevent spamming

            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: promptText, voice: voiceSelection }),
                });

                if (!response.ok) throw new Error("Server error");

                document.getElementById('chatMessage').value = '';
                document.getElementById('status').innerText = "stage 2: processing...";

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let bufferString = "";
                
                // Reset timing for new stream
                nextChunkStartTimestamp = audioContext.currentTime + 0.1;

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    bufferString += decoder.decode(value, { stream: true });
                    let lines = bufferString.split('\n');
                    bufferString = lines.pop(); // Hold onto partial line

                    for (const line of lines) {
                        const base64 = line.trim();
                        if (base64) {
                            decodeAndPlay(base64);
                        }
                    }
                }

                document.getElementById('status').innerText = "audio finished playing.";
            } catch (e) {
                document.getElementById('status').innerText = "error has occurred: " + e.message;
            } finally {
                document.getElementById('sendButton').disabled = false;
            }
        }

        function decodeAndPlay(base64) {
            try {
                const cleanBase64 = base64.replace(/[^A-Za-z0-9+/=]/g, "");
                const binary = atob(cleanBase64);
                const bytes = new Uint8Array(binary.length);
                for (let i = 0; i < binary.length; i++) {
                    bytes[i] = binary.charCodeAt(i);
                }

                const floatData = new Float32Array(bytes.buffer);
                const audioBuffer = audioContext.createBuffer(1, floatData.length, sampleRate);
                audioBuffer.getChannelData(0).set(floatData);

                const source = audioContext.createBufferSource();
                source.buffer = audioBuffer;
                source.connect(audioContext.destination);

                const now = audioContext.currentTime;
                const chunkStartTimestamp = Math.max(nextChunkStartTimestamp, now);
                
                source.start(chunkStartTimestamp);
                nextChunkStartTimestamp = chunkStartTimestamp + audioBuffer.duration;

                document.getElementById('status').innerText = "stage 3: playing audio...";
            } catch (e) {
                console.error("Decoding error", e);
            }
        }
    </script>
</body>
</html>
