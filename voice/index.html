<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Chat</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tinos:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">

    <link rel="icon" type="image/x-icon" href="../assets/favicon.ico">

    <style>
        body {
            background-color: rgba(241, 239, 231);
            margin: 0;
        }

        * {
            font-family: 'Tinos', 'Times New Roman', Times, serif;
            font-weight: 700;
            box-sizing: border-box;

            /* outline: 1px solid red !important; */
        }

        .user-interface-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between; 

            min-height: 100dvh; 
            padding: 10dvh 0 0 0;
        }

        @media (min-height: 800px) and (min-width: 1024px) {
            .user-interface-container {
                padding: 20dvh 0 0 0;
            }
        }

        .controls {
            display: flex;
            flex-direction: column;
            align-items: center;

            gap: 10px; 
        }

        .footer {
            display: flex;
            flex-direction: row;
        }

        #chatMessage {
            width: 500px;
            height: 50px;
            resize: none;
        }

        .logo-link {
            align-self: flex-start;
            display: block;

            line-height: 0;
            text-decoration: none;
        
            margin-left: 20px;
            margin-bottom: 20px;
        }

        .logo-png {
            display: block;
            align-self: flex-start;
            
            width: 20dvh;
            height: auto;
        }

        .disclaimer {
            font-size: 4vh;
            text-align: center;
            width: 70vw;
        }

        .disclaimer2 {
            display: block;
            align-self: flex-end;
        }
    </style>
</head>
<body>
    
    <div class="user-interface-container">
        <div class="controls">
            <select id="voiceInput">
                <option value="brantley">brantley</option>
                <option value="jasper">jasper</option>
            </select>

            <textarea id="chatMessage" placeholder="enter prompt here" style="width: 70vw; height: 50px;"></textarea>
            <button id="sendButton" onclick="runVoiceAssistant()">Send Message</button>

            <div id="status" style="text-align: center;"></div>
        </div>

        <div class="disclaimer">note: it could take a few minutes for the voice assistant to respond.</div>
        <h3>This voice assistant is powered by AI. AI can make mistakes. Do not rely on this for important information.</h3>

        <a href="../" class="logo-link">
            <img src="../assets/logo.png" class="logo-png">
        </a>
    </div>

    <script>
        const workerUrl = 'https://voicemathgpt.ilikekeyboards4924.workers.dev/';
        let audioContext;
        const sampleRate = 24000; // sample rate of the audio that will be received from the endpoint

        let nextChunkStartTimestamp = 0; // this number is the timestamp of when the next chunk will start playing in the audio context

        async function runVoiceAssistant() {
            // initialize the audio context when the user interacts with the page (on user gesture)
            if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: sampleRate });
            if (audioContext.state === 'suspended') await audioContext.resume();

            document.getElementById('status').innerText = 'starting...';

            try {
                // send a post request to the worker to start generating the audio
                let payload = {
                    input: {
                        voice: document.getElementById('voiceInput').value.trim(),
                        text: document.getElementById('chatMessage').value.trim(),
                        // prompt: document.getElementById('chatMessage').value.trim(),
                    }
                };

                const response = await fetch(workerUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                });

                console.log(`voice request sent at ${new Date().toLocaleString()}`);
                document.getElementById('chatMessage').value = '';

                // wait for the response data and start polling runpod using the JOB id
                const data = await response.json();
                if (data.id) poll(data.id);
            } catch (e) {
                alert("error has occured" + e.message);
            }
        }

        async function poll(jobId) {
            // keep polling until the stream is finished
            let isFinished = false;
            while (!isFinished) {
                try {
                    // response and data from the response's json
                    const response = await fetch(`${workerUrl}?jobId=${jobId}`);
                    const data = await response.json();

                    if (data.status === "IN_QUEUE") {
                        document.getElementById('status').innerText = "stage 1: request enqueued...";
                    } else if ((data.status === "IN_PROGRESS" || data.status === "COMPLETED") && data.stream?.length === 0) {
                        document.getElementById('status').innerText = "stage 2: processing request and loading server-side assets...";
                    } else if ((data.status === "IN_PROGRESS" || data.status === "COMPLETED") && data.stream?.length > 0) {
                        document.getElementById('status').innerText = "stage 3: streaming audio data...";
                    }

                    if (data.status === "CANCELLED") {
                        document.getElementById('status').innerText = "request was cancelled by the administrator.";
                        break;
                    } else if (data.status === "FAILED") {
                        document.getElementById('status').innerText = "the request to the server failed.";
                        break;
                    } else if (data.status === "TIMED_OUT") {
                        document.getElementById('status').innerText = "the request to the server timed out.";
                        break;
                    }

                    // if the data contains a stream, iterate through the stream and play the audio chunks
                    if (data.stream) {
                        data.stream.forEach(chunk => {
                            let base64 = (typeof chunk === 'object') ? chunk.output : chunk; // make sure we're getting the base64 string and not the object that contains the string
                            if (base64) decodeAndPlay(base64);
                        });
                    }

                    if (data.status === "COMPLETED") {
                        document.getElementById('status').innerText = "audio finished playing.";
                        isFinished = true;
                    }
                } catch (e) {
                    console.error(e);
                }
                if (!isFinished) await new Promise(f => setTimeout(f, 50)); // only request every 50 ms to stop from being timed out / not overwhelm the server
            }
        }

        function decodeAndPlay(base64) {
            // DECODING SECTION
            const cleanBase64 = base64.replace(/[^A-Za-z0-9+/=]/g, ""); // remove whitespace
            const binary = atob(cleanBase64); // convert base64 back into bytes
            const buffer = new Uint8Array(binary.length); // create buffer that can hold (binary.length) bytes
            for (let i = 0; i < binary.length; i++) {
                buffer[i] = binary.charCodeAt(i); // convert the characters in (binary) into numbers in (buffer)
            }

            const floatData = new Float32Array(buffer.buffer); // convert the bytes in (buffer) into an array of float32's. 4 bytes in (buffer) = one float32 number in (floatData)


            // PLAYING SECTION
            const audioBuffer = audioContext.createBuffer(1, floatData.length, sampleRate); // mono audio (1 channel), make sure buffer can hold (floatData.length) float32's, play at (sampleRate)
            audioBuffer.getChannelData(0).set(floatData); // dump the data into the first channel

            const source = audioContext.createBufferSource(); // create a BufferSource to actually play the audio
            source.buffer = audioBuffer // set the source's buffer to be the audioBuffer that was just created
            source.connect(audioContext.destination); // set the BufferSource's destination to be the audioContext's destination (user's headphones / speaker)

            const chunkStartTimestamp = Math.max(nextChunkStartTimestamp, audioContext.currentTime); // if the time to play audio at (nextChunkStartTimestamp) has already passed, just play the audio immediately
            source.start(chunkStartTimestamp); // timestamp when the audio in the source will start playing

            nextChunkStartTimestamp = chunkStartTimestamp + audioBuffer.duration; // set the starting timestamp for the next chunk that gets received

            document.getElementById('status').innerText = "stage 3: playing audio...";
        }
    </script>
</body>
</html>
